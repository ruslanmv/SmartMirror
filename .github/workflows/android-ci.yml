name: Echo Android CI

on:
  push:
    branches: ["**"]
    paths:
      - "apps/echo-show/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "apps/echo-show/**"
      - ".github/workflows/android-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/echo-show
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle :app:lintDebug :app:assembleDebug
