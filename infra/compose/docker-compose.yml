services:
  smartmirror-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    env_file:
      - ../../.env
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: smartmirror
      POSTGRES_USER: smartmirror
      POSTGRES_PASSWORD: smartmirror
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmirror -d smartmirror"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - smartmirror-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - smartmirror-redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartmirror
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - smartmirror-minio:/data

volumes:
  smartmirror-postgres:
  smartmirror-redis:
  smartmirror-minio:
